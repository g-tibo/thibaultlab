# Research page. Figures live in src/assets/research/.
- title: Research Overview
  items:
  - title: Decoding Stress Responses to Promote Health and Combat Disease
    figure: stress
    paragraphs:
    - At the Thibault Lab, we take a multi-organism approach to uncover the <b>evolutionarily conserved stress response pathways</b> that underpin both cellular resilience and dysfunction. Our work spans <b>basic mechanistic biology</b>, <b>clinically relevant disease models</b>, and <b>computational tool development</b>, with the goal of advancing both fundamental understanding and therapeutic innovation.
- title: Key Areas of Research
  items:
  - title: ER Stress, Lipid Bilayer Stress, and IRE1 Signaling
    figure: upr-sensors
    paragraphs:
    - 'The endoplasmic reticulum is the cell''s primary hub for protein folding and lipid homeostasis. When either is perturbed, the <b>unfolded protein response</b> (<b>UPR</b>) is activated. We showed that ER stress arises from two mechanistically distinct inputs: <b>proteotoxic stress</b>, caused by the accumulation of misfolded proteins, and <b>lipid bilayer stress</b> (<b>LBS</b>), caused by membrane perturbation. Each recruits the UPR but deploys a distinct transcriptional programme.'
    - The master UPR sensor <b>IRE1 </b>is central to our work. IRE1 splices <i>XBP1 </i>mRNA to produce the transcription factor XBP1s and degrades other ER-localized transcripts through regulated IRE1-dependent decay (RIDD). We recently found that aging shifts IRE1 activity away from XBP1 splicing and toward enhanced RIDD, dysregulating critical cellular functions. We are now dissecting the molecular basis of this substrate-preference switch and its consequences for cell physiology during aging and metabolic disease.
  - title: ER-Phagy and Organelle Quality Control
    figure: lipid
    paragraphs:
    - Cells maintain ER health through <b>ER-phagy</b>, the selective autophagy pathway that clears damaged ER fragments via lysosomal degradation. We discovered that IRE1 is not merely a stress sensor. It plays an essential, constitutive role in driving the terminal ER-lysosome fusion step required to complete ER-phagy.
    - This pathway fails with age. Senescent cells lose XBP1s expression and accumulate stalled ER-phagosomes, phenocopying IRE1-knockout cells. Restoring XBP1s reverses this defect. We are now mapping the pathway, defining how it is regulated, and testing whether its restoration can reverse age-related proteostatic decline in polarized epithelial cells and human intestinal organoids.
  - title: Host-Pathogen Interactions in Chronic Wound Healing
    figure: organisms
    paragraphs:
    - Chronic skin wounds represent a major clinical challenge, and bacterial infection is a key driver of healing failure. We focus on <i>Enterococcus faecalis</i>, a common wound pathogen whose virulence mechanisms remain poorly understood. We showed that <i>E. faecalis</i> potently activates the UPR in host keratinocytes and fibroblasts, blocking the cell migration required for wound closure.
    - The trigger is extracellular hydrogen peroxide generated by the bacterium's extracellular electron transport (EET) system, not classical respiration, as previously assumed. This H₂O₂ induces lipid peroxidation in host membranes, which activates the UPR through lipid bilayer stress. We demonstrated this using a screen of nearly 15,000 bacterial mutants. Removing the EET system or neutralizing H₂O₂ with catalase fully rescues keratinocyte migration. We are now dissecting the host signalling pathways that link lipid peroxidation to UPR activation and ferroptosis.
  - title: Integrative Bioinformatics and Systems Tools
    figure: myth
    paragraphs:
    - Biology is increasingly data-rich. Our lab develops computational pipelines that combine natural language processing, gene interaction mining, and multi-species transcriptomics to extract meaningful insights from complex datasets. We integrate data from scientific literature, public RNA-seq repositories, and our own experimental models to map how UPR gene networks are regulated across organisms and disease contexts. These tools support target discovery across all our research programmes.
- title: Research Vision
  items:
  - title: null
    figure: vision
    paragraphs:
    - Our goal is to understand how stress responses, particularly the UPR, can be selectively tuned to protect against cellular damage. This requires identifying key regulators, understanding their context-specific roles, and building tools to map their activity across systems. The same core pathway governs responses to misfolded proteins, membrane damage, bacterial infection, and the slow erosion of aging. We study all of these, because the connections between them are where the most important biology lives.
