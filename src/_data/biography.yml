intro:
- Guillaume Thibault is an Associate Professor (tenured) at the School of Biological Sciences, Nanyang Technological University (NTU), where he also serves as Associate Dean (Graduate Studies) at the College of Science and Senator on the 10th NTU Senate. A biochemist and cell biologist by training, he earned his Ph.D. from the University of Toronto and completed postdoctoral work at Temasek Life Sciences Laboratory before establishing his independent research program at NTU, supported by the Elite Nanyang Assistant Professorship Award.
- His research investigates the interplay between lipid homeostasis and the unfolded protein response, with translational relevance to aging, metabolic disease, and wound infection. This work has been published in leading journals including Science, Molecular Cell, Nature Communications, Cell Host &amp; Microbe, and eLife, and has attracted over S$8.75M in competitive funding as Lead PI. Beyond NTU, he is the founding President of the Society for Cell Biology Singapore, an Associate Editor for Molecular Biology of the Cell and Cell Biology International, Lead Organizer of the 2025 FASEB Endoplasmic Reticulum conference, and serves on multiple committees of the American Society for Cell Biology.
